# docker-compose.yml — Un par entreprise (utiliser le .env correspondant)
# Usage : docker-compose --env-file .env.odoo_co up -d
#      ou docker-compose --env-file .env.urium_co up -d

services:

  # ─── Base de données ───────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &service-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ─── Redis (broker Celery) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *service-logging

  # ─── Migrations et fichiers statiques (une fois avant le backend) ──────────
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: ${COMPOSE_ENV_FILE:-.env}
    volumes:
      - static_data:/app/staticfiles
      - type: bind
        source: ${GOOGLE_KEY_FILE_SOURCE:?Set GOOGLE_KEY_FILE_SOURCE to the host path of the Google service-account JSON}
        target: /run/secrets/google_key.json
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOOGLE_KEY_FILE: /run/secrets/google_key.json
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    logging: *service-logging

  # ─── Backend Django ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: ${COMPOSE_ENV_FILE:-.env}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - type: bind
        source: ${GOOGLE_KEY_FILE_SOURCE:?Set GOOGLE_KEY_FILE_SOURCE to the host path of the Google service-account JSON}
        target: /run/secrets/google_key.json
        read_only: true
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GOOGLE_KEY_FILE: /run/secrets/google_key.json
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 4
        --timeout 120
        --access-logfile -
        --error-logfile -
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $$(python -c 'from django.conf import settings; print(settings.ALLOWED_HOSTS[0])')\" -H 'X-Forwarded-Proto: https' -o /dev/null http://127.0.0.1:8000/admin/login/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *service-logging

  # ─── Worker Celery ─────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: ${COMPOSE_ENV_FILE:-.env}
    volumes:
      - media_data:/app/media
      - type: bind
        source: ${GOOGLE_KEY_FILE_SOURCE:?Set GOOGLE_KEY_FILE_SOURCE to the host path of the Google service-account JSON}
        target: /run/secrets/google_key.json
        read_only: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GOOGLE_KEY_FILE: /run/secrets/google_key.json
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: celery -A config worker -l info --concurrency=2
    logging: *service-logging

  # ─── Frontend React ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging: *service-logging

  # ─── Reverse proxy Nginx ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
      - type: bind
        source: ${TLS_CERT_FILE_SOURCE:?Set TLS_CERT_FILE_SOURCE to the host path of the TLS certificate}
        target: /etc/nginx/ssl/cert.pem
        read_only: true
      - type: bind
        source: ${TLS_KEY_FILE_SOURCE:?Set TLS_KEY_FILE_SOURCE to the host path of the TLS private key}
        target: /etc/nginx/ssl/key.pem
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *service-logging

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
